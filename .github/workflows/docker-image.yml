name: Build custom image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          set -euo pipefail
          export THREADS="$(nproc)"
          export SHA="${GITHUB_SHA}"
          export VERSION="custom"
          export BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export BUILD_TESTS=false

          set -a
          eval "$(python3 scripts/ci/dependency_snapshot.py emit)"
          set +a

          args=()
          while IFS= read -r line; do
            [ -n "$line" ] && args+=(--build-arg "$line")
          done < <(bash scripts/ci/docker-build-args.sh)

          IMAGE="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          docker buildx build \
            --file ./Dockerfile \
            --push \
            --tag "${IMAGE}:custom" \
            "${args[@]}" \
            .
